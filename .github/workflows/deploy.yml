name: Deploy to GitHub Pages

# 기본 브랜치에 push되면 빌드 후 GitHub Pages에 배포한다.
# (활성화: 저장소 Settings → Pages → Source를 "GitHub Actions"로 1회 설정)
on:
  push:
    branches: [claude/mode-v2-rebuild-eigiej]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1개만 (진행 중이면 취소)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # HashRouter라 딥링크는 #/... 이지만, 경로 진입 대비 404도 index.html로 폴백
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
