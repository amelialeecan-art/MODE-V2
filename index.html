<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <title>MODE</title>
    <meta name="description" content="내 상태를 원자료로 기록하는 개인 시계열 앱" />
    <!-- 배경 파스텔에 맞춘 theme-color (V1 라벤더 톤) -->
    <meta name="theme-color" content="#a985e8" />

    <!-- 아이콘: 기존 MODE 모찌 아이콘. iOS 홈 화면은 apple-touch-icon(불투명 PNG)만 사용. -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS Safari '홈 화면에 추가 → 웹 앱으로 열기' standalone 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MODE" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
